{% extends "base.html" %}

{% block title %}{% if seed %}Edit Seed{% else %}Add Seed{% endif %} - Admin{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{% if seed %}Edit Seed{% else %}Add New Seed{% endif %}</h1>
</div>

<div class="form-container">
    <form method="POST" action="{% if seed %}{{ url_for('admin_edit_seed', seed_id=seed.id) }}{% else %}{{ url_for('admin_add_seed') }}{% endif %}">
        <div class="form-group">
            <label for="name">Seed Name *</label>
            <input type="text" id="name" name="name" value="{% if seed %}{{ seed.name }}{% endif %}" required>
        </div>
        
        <div class="form-group">
            <label for="crop_type">Crop Type *</label>
            <input type="text" id="crop_type" name="crop_type" value="{% if seed %}{{ seed.crop_type }}{% endif %}" 
                   placeholder="e.g., Wheat, Rice, Corn" required>
        </div>
        
        <div class="form-group">
            <label for="season">Season *</label>
            <select id="season" name="season" required>
                <option value="">Select Season</option>
                <option value="Kharif" {% if seed and seed.season == 'Kharif' %}selected{% endif %}>Kharif</option>
                <option value="Rabi" {% if seed and seed.season == 'Rabi' %}selected{% endif %}>Rabi</option>
                <option value="Zaid" {% if seed and seed.season == 'Zaid' %}selected{% endif %}>Zaid</option>
                <option value="All Season" {% if seed and seed.season == 'All Season' %}selected{% endif %}>All Season</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="price">Price (₹/kg) *</label>
            <input type="number" id="price" name="price" step="0.01" min="0" 
                   value="{% if seed %}{{ seed.price }}{% endif %}" required>
        </div>
        
        <div class="form-group">
            <label for="stock_quantity">Stock Quantity (kg) *</label>
            <input type="number" id="stock_quantity" name="stock_quantity" min="0" 
                   value="{% if seed %}{{ seed.stock_quantity }}{% endif %}" required>
        </div>
        
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="5">{% if seed %}{{ seed.description }}{% endif %}</textarea>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">{% if seed %}Update Seed{% else %}Add Seed{% endif %}</button>
            <a href="{{ url_for('admin_seeds') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
